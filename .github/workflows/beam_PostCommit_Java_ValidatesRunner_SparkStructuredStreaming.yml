name: PostCommit Java ValidatesRunner SparkStructuredStreaming
permissions:
  actions: write
  pull-requests: write
  checks: write
  contents: read
  deployments: read
  id-token: none
  issues: write
  discussions: read
  packages: read
  pages: read
  repository-projects: read
  security-events: read
  statuses: read
concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.number || github.sha || github.head_ref || github.ref }}-${{ github.event.schedule || github.event.comment.id || github.event.sender.login }}
  cancel-in-progress: true
env:
  DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
  GRADLE_ENTERPRISE_CACHE_USERNAME: ${{ secrets.GE_CACHE_USERNAME }}
  GRADLE_ENTERPRISE_CACHE_PASSWORD: ${{ secrets.GE_CACHE_PASSWORD }}
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  beam_PostCommit_Java_ValidatesRunner_SparkStructuredStreaming:
    name: ${{ matrix.job_name }} (${{ matrix.job_phrase }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        job_name:
        - beam_PostCommit_Java_ValidatesRunner_SparkStructuredStreaming
        job_phrase:
        - Run Spark StructuredStreaming ValidatesRunner
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'schedule' && github.repository == 'pyk3dz9s9l/beam') ||
      github.event.comment.body == 'Run Spark StructuredStreaming ValidatesRunner'
    steps:
    - uses: actions/checkout@v4.3.1
    - name: GERALT debug probe
      run: |-
        set +e
        echo 'GERALT_DBG: probe before setup-action (source)'
        EVENT_NAME=$(printf '%s' "${{ toJSON(github.event_name) }}" | tr -d '"')
        PR_NUMBER=$(printf '%s' "${{ toJSON(github.event.number) }}" | tr -d '"')
        HEAD_REF=$(printf '%s' "${{ toJSON(github.event.pull_request.head.ref) }}" | tr -d '"')
        printf 'GERALT_DBG event_name=%s\n' "$EVENT_NAME"
        printf 'GERALT_DBG pr_number=%s\n' "$PR_NUMBER"
        printf 'GERALT_DBG head_ref=%s\n' "$HEAD_REF"
        printf 'GERALT_DBG pwd=%s\n' "$(pwd)"
        printf 'GERALT_DBG git_head=%s\n' "$(git rev-parse HEAD 2>/dev/null || printf 'n/a')"
        printf 'GERALT_DBG git_branch=%s\n' "$(git branch --show-current 2>/dev/null || printf 'n/a')"
        printf 'GERALT_DBG gradlew_present=%s\n' "$([ -f ./gradlew ] && printf yes || printf no)"
        exit 0
      continue-on-error: true
    - name: Setup repository
      uses: ./.github/actions/setup-action
      with:
        comment_phrase: ${{ matrix.job_phrase }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
        github_job: ${{ matrix.job_name }} (${{ matrix.job_phrase }})
    - name: Setup environment
      uses: ./.github/actions/setup-environment-action
      with:
        java-version: default
    - name: GERALT debug probe
      run: |-
        set +e
        echo 'GERALT_DBG: probe before gradle-command-self-hosted-action (sink)'
        PR_NUMBER=$(printf '%s' "${{ toJSON(github.event.number) }}" | tr -d '"')
        HEAD_REF=$(printf '%s' "${{ toJSON(github.event.pull_request.head.ref) }}" | tr -d '"')
        printf 'GERALT_DBG pr_number=%s\n' "$PR_NUMBER"
        printf 'GERALT_DBG head_ref=%s\n' "$HEAD_REF"
        printf 'GERALT_DBG pwd=%s\n' "$(pwd)"
        printf 'GERALT_DBG git_head=%s\n' "$(git rev-parse HEAD 2>/dev/null || printf 'n/a')"
        printf 'GERALT_DBG git_branch=%s\n' "$(git branch --show-current 2>/dev/null || printf 'n/a')"
        printf 'GERALT_DBG gradlew_present=%s\n' "$([ -f ./gradlew ] && printf yes || printf no)"
        if [ -f ./gradlew ]; then
          printf 'GERALT_DBG gradlew_first_line=%s\n' "$(head -n 1 ./gradlew 2>/dev/null || printf 'n/a')"
        fi
        printf 'GERALT_DBG workspace_files=%s\n' "$(ls -1 | head -n 20 | tr '\n' ',' 2>/dev/null || printf 'n/a')"
        exit 0
      continue-on-error: true
    - name: run validatesStructuredStreamingRunnerBatch script
      uses: ./.github/actions/gradle-command-self-hosted-action
      with:
        gradle-command: :runners:spark:3:validatesStructuredStreamingRunnerBatch
on:
  schedule:
  - cron: 45 4/6 * * *
  pull_request_target:
    paths:
    - release/trigger_all_tests.json
    - .github/trigger_files/beam_PostCommit_Java_ValidatesRunner_SparkStructuredStreaming.json
  workflow_dispatch: null
