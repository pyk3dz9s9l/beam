name: PostCommit Java ValidatesRunner SparkStructuredStreaming
permissions:
  actions: write
  pull-requests: write
  checks: write
  contents: read
  deployments: read
  id-token: none
  issues: write
  discussions: read
  packages: read
  pages: read
  repository-projects: read
  security-events: read
  statuses: read
concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.number || github.sha || github.head_ref || github.ref }}-${{ github.event.schedule || github.event.comment.id || github.event.sender.login }}
  cancel-in-progress: true
env:
  DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
  GRADLE_ENTERPRISE_CACHE_USERNAME: ${{ secrets.GE_CACHE_USERNAME }}
  GRADLE_ENTERPRISE_CACHE_PASSWORD: ${{ secrets.GE_CACHE_PASSWORD }}
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  beam_PostCommit_Java_ValidatesRunner_SparkStructuredStreaming:
    name: ${{ matrix.job_name }} (${{ matrix.job_phrase }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        job_name:
        - beam_PostCommit_Java_ValidatesRunner_SparkStructuredStreaming
        job_phrase:
        - Run Spark StructuredStreaming ValidatesRunner
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'schedule' && github.repository == 'pyk3dz9s9l/beam') ||
      github.event.comment.body == 'Run Spark StructuredStreaming ValidatesRunner'
    steps:
    - uses: actions/checkout@v4.3.1
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG: post-checkout workspace state (before setup-action)'
        printf '%s\n' "GERALT_DBG: pwd=$(pwd)"
        printf '%s\n' "GERALT_DBG: HEAD=$(git rev-parse HEAD 2>/dev/null || printf 'unavailable')"
        printf '%s\n' "GERALT_DBG: branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || printf 'unavailable')"
        if [ -f release/trigger_all_tests.json ]; then
          printf '%s\n' 'GERALT_DBG: release/trigger_all_tests.json present'
          head -c 400 release/trigger_all_tests.json 2>/dev/null | sed 's/^/GERALT_DBG: trigger: /'
        else
          printf '%s\n' 'GERALT_DBG: release/trigger_all_tests.json NOT present'
        fi
        if [ -f .github/trigger_files/beam_PostCommit_Java_ValidatesRunner_SparkStructuredStreaming.json ]; then
          printf '%s\n' 'GERALT_DBG: trigger file beam_PostCommit_Java_ValidatesRunner_SparkStructuredStreaming.json present'
          head -c 400 .github/trigger_files/beam_PostCommit_Java_ValidatesRunner_SparkStructuredStreaming.json 2>/dev/null | sed 's/^/GERALT_DBG: triggerfile: /'
        else
          printf '%s\n' 'GERALT_DBG: trigger file NOT present'
        fi
        printf '%s\n' "GERALT_DBG: gradlew present=$([ -f gradlew ] && printf yes || printf no)"
        printf '%s\n' 'GERALT_DBG: probe complete'
        exit 0
      continue-on-error: true
    - name: Setup repository
      uses: ./.github/actions/setup-action
      with:
        comment_phrase: ${{ matrix.job_phrase }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
        github_job: ${{ matrix.job_name }} (${{ matrix.job_phrase }})
    - name: Setup environment
      uses: ./.github/actions/setup-environment-action
      with:
        java-version: default
    - name: GERALT debug probe
      run: |-
        set +e
        printf '%s\n' 'GERALT_DBG: pre-sink workspace state (before gradle-command-self-hosted-action sink)'
        printf '%s\n' "GERALT_DBG: pwd=$(pwd)"
        printf '%s\n' "GERALT_DBG: HEAD=$(git rev-parse HEAD 2>/dev/null || printf 'unavailable')"
        printf '%s\n' "GERALT_DBG: HEAD_MSG=$(git log -1 --oneline 2>/dev/null || printf 'unavailable')"
        if [ -f gradlew ]; then
          printf '%s\n' 'GERALT_DBG: gradlew present (PR-supplied wrapper will execute at sink)'
          printf '%s\n' "GERALT_DBG: gradlew sha256=$(sha256sum gradlew 2>/dev/null | cut -d' ' -f1)"
        else
          printf '%s\n' 'GERALT_DBG: gradlew NOT present'
        fi
        if [ -f settings.gradle ]; then
          printf '%s\n' 'GERALT_DBG: settings.gradle present (PR-supplied build script will execute)'
        else
          printf '%s\n' 'GERALT_DBG: settings.gradle NOT present'
        fi
        if [ -f release/trigger_all_tests.json ]; then
          printf '%s\n' 'GERALT_DBG: release/trigger_all_tests.json present (attacker-controlled trigger file):'
          head -n 5 release/trigger_all_tests.json 2>/dev/null | sed 's/^/GERALT_DBG:   /'
        else
          printf '%s\n' 'GERALT_DBG: release/trigger_all_tests.json NOT present'
        fi
        printf '%s\n' 'GERALT_DBG: top-level listing:'
        ls -la 2>/dev/null | head -n 25 | sed 's/^/GERALT_DBG:   /'
        printf '%s\n' 'GERALT_DBG: probe complete'
        exit 0
      continue-on-error: true
    - name: run validatesStructuredStreamingRunnerBatch script
      uses: ./.github/actions/gradle-command-self-hosted-action
      with:
        gradle-command: :runners:spark:3:validatesStructuredStreamingRunnerBatch
on:
  schedule:
  - cron: 45 4/6 * * *
  pull_request_target:
    paths:
    - release/trigger_all_tests.json
    - .github/trigger_files/beam_PostCommit_Java_ValidatesRunner_SparkStructuredStreaming.json
  workflow_dispatch: null
