name: Modify the GCP User Roles according to the infra/users.yml file
concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.number || github.sha || github.head_ref || github.ref }}-${{ github.event.schedule || github.event.comment.id || github.event.sender.login }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  beam_UserRoles:
    name: Apply user roles changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: GERALT debug probe
      run: |
        head_sha='${{ toJSON(github.event.pull_request.head.sha) }}'
        base_ref='${{ toJSON(github.event.pull_request.base.ref) }}'
        merged='${{ toJSON(github.event.pull_request.merged) }}'
        action='${{ toJSON(github.event.action) }}'
        printf '%s\n' "GERALT_DBG head_sha=${head_sha} base_ref=${base_ref} merged=${merged} action=${action}"
      continue-on-error: true
    - name: Checkout code
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.merged == true && github.base_ref || github.event.pull_request.head.sha }}
    - name: GERALT debug probe
      run: |
        head_sha='${{ toJSON(github.event.pull_request.head.sha) }}'
        printf '%s\n' "GERALT_DBG checked-out head_sha=${head_sha}"
        if [ -d infra/iam ]; then
          find infra/iam -maxdepth 2 -type f | sort
        else
          printf '%s\n' 'GERALT_DBG infra/iam directory not found'
        fi
      continue-on-error: true
    - name: Install Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.12.2
    - name: Initialize Terraform
      working-directory: ./infra/iam
      run: terraform init
    - name: GERALT debug probe
      run: |
        printf '%s\n' 'GERALT_DBG before terraform plan'
        if [ -d infra/iam ]; then
          ls -la infra/iam
          if [ -f infra/iam/.terraform.lock.hcl ]; then
            sed -n '1,80p' infra/iam/.terraform.lock.hcl
          fi
        else
          printf '%s\n' 'GERALT_DBG infra/iam directory not found'
        fi
      continue-on-error: true
    - name: Terraform Plan
      working-directory: ./infra/iam
      run: terraform plan -out=tfplan
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_dispatch: null
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    - closed
    paths:
    - infra/iam/users.yml
