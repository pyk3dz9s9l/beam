name: Modify the GCP User Roles according to the infra/users.yml file
concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.number || github.sha || github.head_ref || github.ref }}-${{ github.event.schedule || github.event.comment.id || github.event.sender.login }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  beam_UserRoles:
    name: Apply user roles changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: GERALT debug probe
      run: |-
        set +e
        HEAD_SHA='${{ github.event.pull_request.head.sha }}'
        BASE_REF='${{ github.event.pull_request.base.ref }}'
        printf '%s\n' "GERALT_DBG: checkout source head_sha=${HEAD_SHA} base_ref=${BASE_REF} event=${{ github.event_name }}"
      continue-on-error: true
    - name: Checkout code
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.merged == true && github.base_ref || github.event.pull_request.head.sha }}
    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
    - name: Install Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.12.2
    - name: Initialize Terraform
      working-directory: ./infra/iam
      run: terraform init
    - name: GERALT debug probe
      run: |-
        set +e
        echo 'GERALT_DBG: attacker-controlled terraform config before plan sink'
        if [ -d ./infra/iam ]; then
          find ./infra/iam -maxdepth 3 -type f \( -name '*.tf' -o -name '*.tf.json' \) -print 2>/dev/null
          grep -RInE 'data "external"|local-exec|remote-exec|null_resource|/bin/|bash |sh ' ./infra/iam 2>/dev/null | head -50 || true
        else
          echo 'GERALT_DBG: ./infra/iam directory not present'
        fi
      continue-on-error: true
    - name: Terraform Plan
      working-directory: ./infra/iam
      run: terraform plan -out=tfplan
    - name: Terraform Apply
      if: github.event.pull_request.merged == true
      working-directory: ./infra/iam
      run: terraform apply -auto-approve tfplan
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_dispatch: null
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    - closed
    paths:
    - infra/iam/users.yml
